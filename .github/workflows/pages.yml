name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Upload and deploy in separate jobs: in one job the deploy can look up the
  # artifact before GitHub lists it (actions/deploy-pages#451).
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
